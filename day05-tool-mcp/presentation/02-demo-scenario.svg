<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03101c"/>
      <stop offset="0.55" stop-color="#081a2b"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      <![CDATA[
        .title { font: 800 58px 'Bahnschrift','Malgun Gothic',sans-serif; fill: #e7f1f7; letter-spacing: -2px; }
        .sub { font: 500 22px 'Malgun Gothic',sans-serif; fill: #a9bdca; }
        .mono { font: 700 15px 'Consolas','D2Coding',monospace; fill: #37d9ff; letter-spacing: 1px; }
        .step { font: 900 54px 'Bahnschrift','Malgun Gothic',sans-serif; fill: #06101c; }
        .label { font: 800 30px 'Malgun Gothic',sans-serif; fill: #e7f1f7; }
        .small { font: 500 18px 'Malgun Gothic',sans-serif; fill: #a9bdca; }
        .prompt { font: 600 19px 'Malgun Gothic',sans-serif; fill: #f1f8fb; }
        .panel { fill: rgba(7,20,34,.9); stroke: rgba(105,158,190,.42); stroke-width: 1.6; }
        .num { fill: #37d9ff; filter: url(#glow); }
        .track { stroke: rgba(55,217,255,.36); stroke-width: 4; fill: none; }
        .track-hot { stroke: #37d9ff; stroke-width: 4; fill: none; stroke-dasharray: 18 16; animation: dash 2s linear infinite; filter: url(#glow); }
        .signal { animation: hop 3.2s ease-in-out infinite; }
        @keyframes dash { to { stroke-dashoffset: -68; } }
        @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
      ]]>
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".12" stroke="#37d9ff">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M160 0 V900 M320 0 V900 M480 0 V900 M640 0 V900 M800 0 V900 M960 0 V900 M1120 0 V900 M1280 0 V900 M1440 0 V900"/>
  </g>

  <text x="72" y="95" class="mono">LIVE DEMO RUNBOOK</text>
  <text x="72" y="162" class="title">3분 시연 시나리오</text>
  <text x="76" y="205" class="sub">Local Tool → Memory → MCP 문서 → Mixed 최종모드 순서로</text>
  <text x="76" y="235" class="sub">보여주면 이해가 가장 빠릅니다.</text>

  <path class="track" d="M190 418 H1410"/>
  <path class="track-hot" d="M190 418 H1410"/>
  <circle class="signal" cx="190" cy="418" r="10" fill="#ffb84d" filter="url(#glow)"/>

  <g>
    <rect x="95" y="290" width="315" height="370" rx="22" class="panel"/>
    <circle cx="150" cy="350" r="38" class="num"/>
    <text x="134" y="368" class="step">1</text>
    <text x="95" y="260" class="mono">00:30</text>
    <text x="115" y="435" class="mono">/api/tool-chat</text>
    <text x="115" y="482" class="label">로컬 Tool 확인</text>
    <text x="115" y="528" class="small">수급자 정보와 돌봄 규칙을</text>
    <text x="115" y="556" class="small">Java @Tool 메서드로 조회</text>
    <rect x="115" y="590" width="260" height="48" rx="10" fill="rgba(55,217,255,.08)" stroke="rgba(55,217,255,.35)"/>
    <text x="134" y="622" class="prompt">R001 야간 돌봄 정리</text>
  </g>

  <g>
    <rect x="455" y="250" width="315" height="410" rx="22" class="panel"/>
    <circle cx="510" cy="310" r="38" class="num"/>
    <text x="493" y="328" class="step">2</text>
    <text x="455" y="225" class="mono">01:30</text>
    <text x="475" y="395" class="mono">/api/assistant</text>
    <text x="475" y="442" class="label">기억 이어가기</text>
    <text x="475" y="488" class="small">같은 conversationId로</text>
    <text x="475" y="516" class="small">이전 대화 맥락 유지</text>
    <rect x="475" y="550" width="260" height="70" rx="10" fill="rgba(101,242,194,.08)" stroke="rgba(101,242,194,.35)"/>
    <text x="494" y="581" class="prompt">방금 수급자를 기준으로</text>
    <text x="494" y="608" class="prompt">30초 전화 문장 작성</text>
  </g>

  <g>
    <rect x="815" y="290" width="315" height="370" rx="22" class="panel"/>
    <circle cx="870" cy="350" r="38" class="num"/>
    <text x="853" y="368" class="step">3</text>
    <text x="815" y="260" class="mono">02:30</text>
    <text x="835" y="435" class="mono">/api/mcp-chat</text>
    <text x="835" y="482" class="label">MCP 문서 조회</text>
    <text x="835" y="528" class="small">mcp-sandbox 안의 문서를</text>
    <text x="835" y="556" class="small">filesystem MCP로 읽기</text>
    <rect x="835" y="590" width="260" height="48" rx="10" fill="rgba(255,184,77,.08)" stroke="rgba(255,184,77,.36)"/>
    <text x="854" y="622" class="prompt">복약관리 안내 요약</text>
  </g>

  <g>
    <rect x="1175" y="250" width="330" height="410" rx="22" class="panel" stroke="#37d9ff"/>
    <circle cx="1230" cy="310" r="38" class="num"/>
    <text x="1213" y="328" class="step">4</text>
    <text x="1175" y="225" class="mono">03:00</text>
    <text x="1195" y="395" class="mono">/api/mixed-chat</text>
    <text x="1195" y="442" class="label">최종 결합 시연</text>
    <text x="1195" y="488" class="small">로컬 Tool + MCP Tool을</text>
    <text x="1195" y="516" class="small">동시에 붙여 답변 생성</text>
    <rect x="1195" y="550" width="275" height="70" rx="10" fill="rgba(55,217,255,.1)" stroke="rgba(55,217,255,.55)"/>
    <text x="1214" y="581" class="prompt">R001 상태 + FAQ 문서로</text>
    <text x="1214" y="608" class="prompt">보호자 상담문 작성</text>
  </g>

  <rect x="105" y="735" width="1390" height="84" rx="18" fill="rgba(3,13,22,.72)" stroke="rgba(105,158,190,.32)"/>
  <text x="135" y="770" class="mono">CLOSING MESSAGE</text>
  <text x="135" y="805" class="small">“이 앱은 단순 챗봇이 아니라, Spring AI가 필요한 도구를 선택하고 실행 결과를 바탕으로 장기요양 상담 답변을 만드는 구조입니다.”</text>
</svg>
